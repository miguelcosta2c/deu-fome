[project]
name = "deu-fome"
version = "0.0.1"
description = "project"
readme = "README.md"
license = "MIT"
authors = [{ name = "Miguel Costa", email = "miguelcosmecosta@email.com" }]
requires-python = ">=3.13"
dependencies = [
  "django>=6.0.7",
  "django-htmx>=1.28.0",
  "pillow>=12.3.0",
  "python-dotenv>=1.2.2",
]

# SECURITY: 7-day grace period against supply chain attacks (like in npm)
[tool.uv]
exclude-newer = "7 days"

# [project.urls]
# Homepage = "https://homepage.example.com"

[dependency-groups]
dev = [
  "coverage>=7.15.2",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.12.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.22",
]

# ============================
# Lint and formatting (Ruff)
# ============================
[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = [
  "venv",
  ".venv",
  "env",
  ".env",
  "node_modules",
  "__pycache__",
  "**/migrations",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A004",   # Checks for imports that use the same names as builtins.
  "ARG001", # Checks for the presence of unused arguments in function definitions.
  "ARG002", # Checks for the presence of unused arguments in instance method definitions.
  "ANN401", # Checks that function arguments are annotated with a more specific type than Any.
  "COM812", # Checks for the absence of trailing commas.
  "D",      # All pydocstyle (D)
  "ERA001", # Checks for commented-out Python code.
  "INP001", # Checks for packages that are missing an __init__.py file.
  "S101",   # Checks for uses of the assert keyword.
  "T201",   # Checks for print statements,
  "S106",   # Checks for potential uses of hardcoded passwords in function calls.
  "RUF012", # Checks for mutable default values in class attributes.
  "CPY001", # Checks for the presence of copyright notices in source files.
  "DJ001",  # Checks nullable string-based fields (like CharField and TextField) in Django models.
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["ANN201", "S101", "ANN001", "PLR2004"]
"**/migrations/*.py" = ["ALL"]
"core/settings.py" = ["S105", "F405", "F403"]
"**/manage.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["core", "apps"]

# ============================
# Typing (Pyright)
# ============================
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = ["core", "apps", "tests"]
exclude = [
  "**/.*",
  "**/.venv",
  "**/venv",
  "**/env",
  "**/node_modules",
  "**/__pycache__",
  "**/migrations",
]
venv = ".venv"
venvPath = "."

# ============================
# Tests (Pytest)
# ============================
[tool.pytest.ini_options]
addopts = "-s -v --color=yes --tb=short --nomigrations --strict-markers"
DJANGO_SETTINGS_MODULE = "core.settings"
testpaths = ["apps"]

# ============================
# Coverage
# ============================
[tool.coverage.run]
branch = true
source = ["apps/recipes", "apps/users"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/__init__.py",
  "*/settings.py",
  "*/wsgi.py",
  "*/asgi.py",
  "*/manage.py",
  "*/core/urls.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

# ============================
# Build and Hatchling
# ============================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]
